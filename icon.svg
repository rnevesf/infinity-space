<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Fundo escuro -->
  <circle cx="64" cy="64" r="62" fill="#080C14"/>
  
  <!-- Galáxia espiral simplificada -->
  <g opacity="0.7">
    <!-- Braço espiral 1 -->
    <path d="M64,64 Q80,50 95,35 Q105,28 110,30" stroke="#4EB0FF" stroke-width="2.5" fill="none" opacity="0.8"/>
    <!-- Braço espiral 2 -->
    <path d="M64,64 Q48,50 33,35 Q23,28 18,30" stroke="#4EB0FF" stroke-width="2.5" fill="none" opacity="0.8"/>
    <!-- Braço espiral 3 -->
    <path d="M64,64 Q75,78 85,95 Q90,108 88,113" stroke="#FF8C40" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Braço espiral 4 -->
    <path d="M64,64 Q53,78 43,95 Q38,108 40,113" stroke="#FF8C40" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Estrelas nos braços -->
  <circle cx="95" cy="35" r="3" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="18" cy="30" r="2.5" fill="#FF6060" opacity="0.9"/>
  <circle cx="88" cy="113" r="2" fill="#60FF90" opacity="0.8"/>
  <circle cx="40" cy="112" r="2.5" fill="#FFD060" opacity="0.8"/>
  <circle cx="110" cy="60" r="2" fill="#A0D0FF" opacity="0.8"/>
  <circle cx="20" cy="70" r="2" fill="#FFA0FF" opacity="0.8"/>
  
  <!-- Núcleo galáctico (estrela central vibrante) -->
  <circle cx="64" cy="64" r="12" fill="#1A2A4A" opacity="0.8"/>
  <circle cx="64" cy="64" r="8" fill="#4EB0FF" opacity="0.5"/>
  <circle cx="64" cy="64" r="5" fill="#80D0FF" opacity="0.8"/>
  <circle cx="64" cy="64" r="2.5" fill="#FFFFFF"/>
</svg>
